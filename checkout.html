<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | SHOPGY</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="images/logo.png" alt="SHOPGY"><b>SHOPGY</b></a><nav><a href="index.html">Shop</a></nav></header><main class="section"><h1>Checkout</h1><div class="checkout-layout"><form id="orderForm" class="card"><h2>Delivery Details</h2><label>Full Name<input name="name" required></label><label>Mobile Number<input name="phone" maxlength="10" required></label><label>Full Address<textarea name="address" required></textarea></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>PIN Code<input name="pincode" maxlength="6" required></label><h2>Payment</h2><label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="payment" value="UPI"> Pay Online using UPI</label><div id="upiBox" class="upi-box hidden"><h3>Scan QR</h3><img src="images/upi-qr.png" alt="UPI QR"><input name="utr" placeholder="UTR / Transaction ID"></div><button class="btn full" type="submit">Place Order</button></form><aside class="card"><h2>Your Order</h2><div id="cartItems"></div><hr><h2>Total: <span id="cartTotal">₹0</span></h2></aside></div></main><script src="config.js"></script><script src="app.js"></script><script src="checkout.js"></script></body></html>
